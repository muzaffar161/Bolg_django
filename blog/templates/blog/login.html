{% extends "blog/base.html" %}

{% block title %}Login | Frame &amp; Field{% endblock %}

{% block content %}

<div class="auth-page">
    <div class="auth-card">
        <p class="eyebrow">WELCOME BACK</p>
        <h1>Login</h1>
        <p class="muted">Sign in to write, comment and manage your stories.</p>

        <form method="POST" class="stack-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>

        <p class="auth-switch">
            New here? <a href="{% url 'register' %}">Create an account</a>
        </p>
    </div>
</div>

{% endblock %}
